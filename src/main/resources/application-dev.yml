spring:
  config:
    activate:
      on-profile: dev
    import: optional:file:.env[.properties]
  devtools:
    add-properties: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

openapi:
  service:
    api-docs: clothing-store-api-docs
    title: Clothing Store API
    version: 1.0.0
    server: http://localhost:8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000 # 15 minutes in ms

brevo:
  api-key: ${BREVO_API_KEY}
  sender-email: lequanghung.work@gmail.com
  sender-name: Clothing Store

app:
  backend-url: ${BACKEND_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  verification-token-ttl: 900 # 15 minutes in seconds
  refresh-token-ttl: 604800 # 7 days in seconds
