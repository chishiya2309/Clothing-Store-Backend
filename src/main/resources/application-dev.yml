spring:
  config:
    activate:
      on-profile: dev
  devtools:
    add-properties: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

openapi:
  service:
    api-docs: clothing-store-api-docs
    title: Clothing Store API
    version: 1.0.0
    server: http://localhost:8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000 # 1 hour in ms

brevo:
  api-key: ${BREVO_API_KEY}
  sender-email: lequanghung.work@gmail.com
  sender-name: Clothing Store

app:
  backend-url: ${BACKEND_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  verification-token-ttl: 900 # 15 minutes in seconds
  refresh-token-ttl: 604800 # 7 days in seconds
  remember-me-token-ttl: 2592000 # 30 days in seconds

google:
  client-id: ${GOOGLE_CLIENT_ID}

payment:
  vnpay:
    enabled: ${VNPAY_ENABLED:false}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:}
    version: ${VNPAY_VERSION:2.1.0}
    command: ${VNPAY_COMMAND:pay}
    order-type: ${VNPAY_ORDER_TYPE:other}
    locale: ${VNPAY_LOCALE:vn}
    currency: ${VNPAY_CURRENCY:VND}
    expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}
  momo:
    enabled: ${MOMO_ENABLED:false}
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
    create-url: ${MOMO_CREATE_URL:https://test-payment.momo.vn/v2/gateway/api/create}
    redirect-url: ${MOMO_REDIRECT_URL:}
    ipn-url: ${MOMO_IPN_URL:}
    request-type: ${MOMO_REQUEST_TYPE:captureWallet}
    lang: ${MOMO_LANG:vi}
    auto-capture: ${MOMO_AUTO_CAPTURE:true}
    connect-timeout-seconds: ${MOMO_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${MOMO_READ_TIMEOUT_SECONDS:30}

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    region: ${AWS_REGION:ap-southeast-1}
    bucket-name: ${AWS_S3_BUCKET:clothing-store-banners}
