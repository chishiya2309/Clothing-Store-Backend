spring:
  config:
    activate:
      on-profile: dev
  devtools:
    add-properties: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  backend-url: ${BACKEND_URL:http://localhost:8080}

payment:
  vnpay:
    enabled: ${VNPAY_ENABLED:false}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:}
    version: ${VNPAY_VERSION:2.1.0}
    command: ${VNPAY_COMMAND:pay}
    order-type: ${VNPAY_ORDER_TYPE:other}
    locale: ${VNPAY_LOCALE:vn}
    currency: ${VNPAY_CURRENCY:VND}
    expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}
  momo:
    enabled: ${MOMO_ENABLED:false}
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
    create-url: ${MOMO_CREATE_URL:https://test-payment.momo.vn/v2/gateway/api/create}
    redirect-url: ${MOMO_REDIRECT_URL:}
    ipn-url: ${MOMO_IPN_URL:}
    request-type: ${MOMO_REQUEST_TYPE:captureWallet}
    lang: ${MOMO_LANG:vi}
    auto-capture: ${MOMO_AUTO_CAPTURE:true}
    connect-timeout-seconds: ${MOMO_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${MOMO_READ_TIMEOUT_SECONDS:30}

openapi:
  service:
    api-docs: clothing-store-api-docs
    title: Clothing Store API
    version: 1.0.0
    server: ${BACKEND_SERVICE:http://localhost:${server.port}
