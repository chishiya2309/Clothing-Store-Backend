server:
  port: 8080

spring:
  application:
    name: clothing-store-backend
  profiles:
    active: @spring.profiles.active@
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:Clothing-Store-Backend/.env[.properties]

management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  level:
    root: INFO
    web: INFO

openrouteservice:
  api-key: ${OPENROUTESERVICE_API_KEY:}
  base-url: ${OPENROUTESERVICE_BASE_URL:https://api.heigit.org}

shipping:
  shop-latitude: ${SHOP_LATITUDE:10.762622}
  shop-longitude: ${SHOP_LONGITUDE:106.660172}
  base-fee: ${SHIPPING_BASE_FEE:25000}
  base-distance-km: ${SHIPPING_BASE_DISTANCE_KM:10}
  extra-fee-per-km: ${SHIPPING_EXTRA_FEE_PER_KM:3000}
  max-fee: ${SHIPPING_MAX_FEE:50000}

app:
  rate-limit:
    enabled: false
    rules:
      - key: auth-login
        path-patterns:
          - /api/auth/login
        methods:
          - POST
        limit: 5
        window-seconds: 60
        message: Too many login attempts. Please try again in a minute.
      - key: auth-register
        path-patterns:
          - /api/auth/register
          - /api/auth/resend-verification
          - /api/auth/forgot-password
          - /api/auth/reset-password
        methods:
          - POST
        limit: 5
        window-seconds: 600
        message: Too many auth requests. Please wait a few minutes and try again.
      - key: auth-google
        path-patterns:
          - /api/auth/google
        methods:
          - POST
        limit: 10
        window-seconds: 60
        message: Too many Google sign-in attempts. Please try again shortly.
      - key: auth-refresh
        path-patterns:
          - /api/auth/refresh
        methods:
          - POST
        limit: 30
        window-seconds: 60
        message: Too many token refresh requests. Please slow down and try again.
      - key: public-catalog
        path-patterns:
          - /api/products/**
          - /api/guest/**
          - /sitemap.xml
          - /robots.txt
        methods:
          - GET
        limit: 180
        window-seconds: 60
        message: Too many catalog requests. Please retry in a moment.
