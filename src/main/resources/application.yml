server:
  port: 8080

spring:
  application:
    name: clothing-store-backend
  profiles:
    active: @spring.profiles.active@
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:Clothing-Store-Backend/.env[.properties]

management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  level:
    root: INFO
    web: INFO
